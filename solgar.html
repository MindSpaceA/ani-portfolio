<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solgar Wellness Store | Ani Navasardyan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f7f7f2;
            color: #25291f;
            line-height: 1.6;
        }

        img,
        video {
            display: block;
            width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 24px 6%;

            border-bottom: 1px solid rgba(0,0,0,0.07);

            background: #f7f7f2;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
        }

        .back {
            font-size: 14px;
            color: #6b6f65;

            transition: 0.3s;
        }

        .back:hover {
            color: #25291f;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;

            padding: 110px 6% 90px;
        }

        .header-content {
            max-width: 800px;
            margin: auto;
        }

        .header h1 {
            font-size: clamp(45px, 7vw, 85px);

            line-height: 1;

            letter-spacing: -4px;

            margin-bottom: 25px;
        }

        .header p {
            max-width: 650px;

            margin: auto;

            color: #6b6f65;

            font-size: 17px;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            max-width: 1200px;

            margin: auto;

            padding: 0 6% 100px;
        }


        .section {
            margin-top: 80px;
        }

        .section-title {
            margin-bottom: 30px;
        }

        .section-title span {
            display: block;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 2px;

            color: #747b66;

            margin-bottom: 8px;
        }

        .section-title h2 {
            font-size: 34px;

            letter-spacing: -1.5px;
        }


        /* =========================
           VIDEOS
        ========================= */

        .videos {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }

        .video {
            overflow: hidden;

            border-radius: 20px;

            background: #e3e3da;

            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .video video {
            width: 100%;
            height: auto;
        }


        /* =========================
           IMAGES
        ========================= */

        .images {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }

        .image {
            overflow: hidden;

            border-radius: 20px;

            background: #e3e3da;
        }

        .image.full {
            grid-column: span 2;
        }

        .image img {
            width: 100%;
            height: auto;

            transition: transform 0.4s ease;
        }

        .image:hover img {
            transform: scale(1.02);
        }


        /* =========================
           TECHNOLOGIES
        ========================= */

        .technologies {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;
        }

        .technology {
            padding: 12px 20px;

            background: white;

            border: 1px solid rgba(0,0,0,0.07);

            border-radius: 50px;

            font-size: 14px;

            font-weight: 500;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 30px;

            padding: 35px 6%;

            text-align: center;

            font-size: 13px;

            color: #777b70;

            border-top: 1px solid rgba(0,0,0,0.07);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 18px 5%;
            }

            .logo {
                font-size: 16px;
            }

            .back {
                font-size: 12px;
            }

            .header {
                padding: 80px 5% 65px;
            }

            .header h1 {
                font-size: clamp(45px, 14vw, 65px);

                letter-spacing: -3px;
            }

            .header p {
                font-size: 15px;
            }

            .content {
                padding: 0 5% 70px;
            }

            .section {
                margin-top: 60px;
            }

            .section-title h2 {
                font-size: 28px;
            }

            .videos {
                grid-template-columns: 1fr;

                gap: 18px;
            }

            .images {
                grid-template-columns: 1fr;

                gap: 18px;
            }

            .image.full {
                grid-column: span 1;
            }

            .video,
            .image {
                border-radius: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <a href="index.html" class="logo">
            Ani Navasardyan
        </a>

        <a href="index.html#projects" class="back">
            ← Back to Portfolio
        </a>

    </nav>



    <!-- =========================
         TITLE + DESCRIPTION
    ========================= -->

    <header class="header">

        <div class="header-content">

            <h1>
                Solgar Wellness Store
            </h1>

            <p>
                Premium Shopify wellness store with custom
                sections, collections and product layouts.
            </p>

        </div>

    </header>



    <main class="content">


        <!-- =========================
             VIDEOS
        ========================= -->

        <section class="section">

            <div class="section-title">

                <span>
                    Project
                </span>

                <h2>
                    Videos
                </h2>

            </div>


            <div class="videos">


                <!-- VIDEO 1 -->

                <div class="video">

                    <video
                        controls
                        playsinline
                        preload="metadata"
                    >

                        <source
                            src="videos/solgar-1.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support video.

                    </video>

                </div>


                <!-- VIDEO 2 -->

                <div class="video">

                    <video
                        controls
                        playsinline
                        preload="metadata"
                    >

                        <source
                            src="videos/solgar-2.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support video.

                    </video>

                </div>


            </div>

        </section>



        <!-- =========================
             IMAGES
        ========================= -->

        <section class="section">

            <div class="section-title">

                <span>
                    Project
                </span>

                <h2>
                    Screenshots
                </h2>

            </div>


            <div class="images">


                <!-- IMAGE 1 -->

                <div class="image full">

                    <img
                        src="images/solgar-1.jpg"
                        alt="Solgar Wellness Store"
                        loading="lazy"
                    >

                </div>


                <!-- IMAGE 2 -->

                <div class="image">

                    <img
                        src="images/solgar-2.jpg"
                        alt="Solgar Shopify store"
                        loading="lazy"
                    >

                </div>


                <!-- IMAGE 3 -->

                <div class="image">

                    <img
                        src="images/solgar-3.jpg"
                        alt="Solgar Shopify collection"
                        loading="lazy"
                    >

                </div>


                <!-- IMAGE 4 -->

                <div class="image">

                    <img
                        src="images/solgar-4.jpg"
                        alt="Solgar product page"
                        loading="lazy"
                    >

                </div>


                <!-- IMAGE 5 -->

                <div class="image">

                    <img
                        src="images/solgar-5.jpg"
                        alt="Solgar wellness section"
                        loading="lazy"
                    >

                </div>


            </div>

        </section>



        <!-- =========================
             TECHNOLOGIES
        ========================= -->

        <section class="section">

            <div class="section-title">

                <span>
                    Technologies
                </span>

                <h2>
                    Built with
                </h2>

            </div>


            <div class="technologies">

                <div class="technology">
                    Shopify
                </div>

                <div class="technology">
                    Liquid
                </div>

                <div class="technology">
                    HTML5
                </div>

                <div class="technology">
                    CSS3
                </div>

                <div class="technology">
                    JavaScript
                </div>

            </div>

        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        © 2026 Ani Navasardyan · Shopify Developer

    </footer>


</body>
</html>
