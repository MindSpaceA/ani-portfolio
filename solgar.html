<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solgar Wellness Store | Ani Navasardyan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: "Inter", sans-serif;
            background: #eef5ff;
            color: #102a43;
            line-height: 1.6;
        }


        img,
        video {
            display: block;
            width: 100%;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 24px 6%;

            border-bottom: 1px solid rgba(30, 90, 160, 0.12);

            background: rgba(238, 245, 255, 0.92);

            position: relative;
            z-index: 10;
        }


        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #123b63;

            letter-spacing: -0.3px;
        }


        .back {
            font-size: 14px;
            color: #58708a;

            transition: 0.3s ease;
        }


        .back:hover {
            color: #1769aa;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;

            padding: 110px 6% 90px;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(92, 160, 220, 0.20),
                    transparent 45%
                );
        }


        .header-content {
            max-width: 800px;
            margin: auto;
        }


        .header h1 {
            font-size: clamp(45px, 7vw, 85px);

            line-height: 1;

            letter-spacing: -4px;

            margin-bottom: 25px;

            color: #0d3557;
        }


        .header p {
            max-width: 650px;

            margin: auto;

            color: #58708a;

            font-size: 17px;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            max-width: 1200px;

            margin: auto;

            padding: 0 6% 100px;
        }


        .section {
            margin-top: 80px;
        }


        .section-title {
            margin-bottom: 30px;
        }


        .section-title span {
            display: block;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 2px;

            color: #3978b8;

            margin-bottom: 8px;

            font-weight: 600;
        }


        .section-title h2 {
            font-size: 34px;

            letter-spacing: -1.5px;

            color: #123b63;
        }


        /* =========================
           VIDEOS
        ========================= */

        .videos {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }


        .video {
            overflow: hidden;

            border-radius: 20px;

            background: #dbeafe;

            border: 1px solid rgba(59, 130, 246, 0.15);

            box-shadow:
                0 15px 40px rgba(30, 80, 140, 0.10);

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }


        .video:hover {
            transform: translateY(-4px);

            box-shadow:
                0 20px 50px rgba(30, 80, 140, 0.15);
        }


        .video video {
            width: 100%;
            height: auto;

            background: #dbeafe;
        }


        /* =========================
           IMAGES
        ========================= */

        .images {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }


        .image {
            overflow: hidden;

            border-radius: 20px;

            background: #dbeafe;

            border: 1px solid rgba(59, 130, 246, 0.12);

            box-shadow:
                0 12px 35px rgba(30, 80, 140, 0.07);
        }


        .image.full {
            grid-column: span 2;
        }


        .image img {
            width: 100%;
            height: auto;

            transition:
                transform 0.4s ease;
        }


        .image:hover img {
            transform: scale(1.02);
        }


        /* =========================
           TECHNOLOGIES
        ========================= */

        .technologies {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;
        }


        .technology {
            padding: 12px 20px;

            background: #ffffff;

            border: 1px solid rgba(59, 130, 246, 0.15);

            border-radius: 50px;

            font-size: 14px;

            font-weight: 500;

            color: #1d5f9e;

            box-shadow:
                0 5px 18px rgba(30, 80, 140, 0.05);

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }


        .technology:hover {
            background: #e4f0ff;

            transform: translateY(-2px);
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 30px;

            padding: 35px 6%;

            text-align: center;

            font-size: 13px;

            color: #66809a;

            border-top: 1px solid rgba(30, 90, 160, 0.12);

            background: rgba(255, 255, 255, 0.35);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 18px 5%;
            }


            .logo {
                font-size: 16px;
            }


            .back {
                font-size: 12px;
            }


            .header {
                padding: 80px 5% 65px;
            }


            .header h1 {
                font-size: clamp(45px, 14vw, 65px);

                letter-spacing: -3px;
            }


            .header p {
                font-size: 15px;
            }


            .content {
                padding: 0 5% 70px;
            }


            .section {
                margin-top: 60px;
            }


            .section-title h2 {
                font-size: 28px;
            }


            .videos {
                grid-template-columns: 1fr;

                gap: 18px;
            }


            .images {
                grid-template-columns: 1fr;

                gap: 18px;
            }


            .image.full {
                grid-column: span 1;
            }


            .video,
            .image {
                border-radius: 16px;
            }


            .technologies {
                gap: 9px;
            }


            .technology {
                padding: 10px 16px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>
